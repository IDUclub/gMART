# Auto-fill the title and body of pull requests.
#   PRs into dev:
#     * title = "vX.Y.Z (branch)": the version the PR will be merged with
#       (.github/scripts/versioning.py: label "major" -> major, feat/* or feature/* -> minor,
#       any other branch -> patch) - predicted from dev until auto-merge bumps it in the branch
#       (version-bump.yml), the bumped one after. GitHub uses the PR title as the merge commit
#       title;
#     * body = the PR's commits.
#   PRs into main (releases):
#     * title = "vX.Y.Z": the version already on dev - a release does not bump it;
#     * body = the CHANGELOG.md sections since the previous release tag (the PR's commits when
#       there are none).
# Re-runs on every push to the PR (synchronize) and on label changes, so the title/body always
# reflect the current state - note this overwrites manual edits. Runs only for same-repo branches
# (fork PRs get a read-only token).

name: PR autofill

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  autofill:
    name: Fill PR title and body
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: commit lists and the last release tag

      - name: Compute and apply title + body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          script=.github/scripts/versioning.py
          commits="$(git log --reverse --format='- %s' "${BASE_SHA}..${HEAD_SHA}")"
          # The checkout is the PR merge ref: the version the merge would carry.
          version="$(python3 "$script" current)"
          if [ "$BASE_REF" = "main" ]; then
            title="v${version}"
            since="$(python3 "$script" latest-tag --below "$version")"
            body="$(python3 "$script" notes --version "$version" ${since:+--since "$since"})"
            [ -z "$body" ] && body="$commits"
          elif python3 "$script" bumped --ref "origin/${BASE_REF}"; then
            # Already bumped in the branch (version-bump.yml): show that version.
            title="v${version} (${HEAD_REF})"
            body="$commits"
          else
            increment="$(python3 "$script" kind --branch "$HEAD_REF" --labels "$LABELS")"
            next="$(python3 "$script" next --kind "$increment" --ref "origin/${BASE_REF}")"
            title="v${next} (${HEAD_REF})"
            body="$commits"
          fi
          [ -z "$body" ] && body="- (no commits)"

          # A late run (approved after the merge, or for an older push) must not overwrite the
          # title the PR was merged with.
          current="$(gh pr view "$PR" --json state,headRefOid --jq '.state + " " + .headRefOid')"
          if [ "$current" != "OPEN ${HEAD_SHA}" ]; then
            echo "PR is merged, closed or has a newer head (${current}) - leaving it as is"
            exit 0
          fi
          gh pr edit "$PR" --title "$title" --body "$body"

# Every merge into dev bumps the version: the "version" job raises it for the merged PR (label
# "major" -> major, feat/* or feature/* -> minor, any other branch -> patch), refreshes uv.lock and
# CHANGELOG.md and pushes a "bump:" commit with the deploy bot's token. That push starts this
# workflow again, and only a "bump:" commit is released, so the deployed image carries its version.
# "[skip bump]" in a commit message skips both.

name: Kubernetes dev release

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  version:
    name: Bump version
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') && !contains(github.event.head_commit.message, '[skip bump]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # put the actual version into the merged PR's title
    steps:
      # GITHUB_TOKEN pushes start no workflow; the bot's push starts the release of the bump.
      - name: Create deploy bot token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"

      - name: Set up Python
        run: uv python install 3.11

      - name: Bump version, uv.lock and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/bump-dev.sh

  release:
    if: ${{ startsWith(github.event.head_commit.message, 'bump:') }}
    uses: IDUclub/urban-assistant-deploy/.github/workflows/reusable-application-release.yaml@main
    with:
      service: gmart
      test-command: |
        python -m pip install --disable-pip-version-check uv==0.12.10
        uv python install 3.11
        uv sync --locked
        export SERVICE_AUTH_SERVER_URL=http://localhost:9999
        export SERVICE_AUTH_REALM=test
        export SERVICE_AUTH_CLIENT_ID=test-client
        export SERVICE_AUTH_CLIENT_SECRET=test-secret
        uv run pytest --verbose tests/unit
    secrets: inherit

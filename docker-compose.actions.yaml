# Docker keeps at most 5 files of 20 MB (100 MB) of stdout/stderr per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  idu_agents:
    logging: *default-logging
    image: ${AGENTS_IMAGE}
    container_name: ${AGENTS_CONTAINER_NAME}
    restart: always
    ports:
      - "80:80"
    environment: &agents-environment
      OLLAMA_API_URL: ${OLLAMA_API_URL}
      IDU_MCP_SERVER: ${IDU_MCP_SERVER}
      OBJECTS_EFFECTS_MCP_SERVER: ${OBJECTS_EFFECTS_MCP_SERVER}
      DVD_MCP_SERVER: ${DVD_MCP_SERVER}
      DVD_API_URL: ${DVD_API_URL:-}
      DVD_CONTEXT_WINDOW_TOKENS: ${DVD_CONTEXT_WINDOW_TOKENS:-100000}
      DVD_CONTEXT_CONCURRENCY: ${DVD_CONTEXT_CONCURRENCY:-4}
      DVD_RETRIEVAL_MAX_PAGES: ${DVD_RETRIEVAL_MAX_PAGES:-100}
      DVD_ANSWER_TEMPERATURE: ${DVD_ANSWER_TEMPERATURE:-0.2}
      DVD_CRITIC_REASONING_EFFORT: ${DVD_CRITIC_REASONING_EFFORT:-medium}
      DVD_MAX_DRAFTS_PER_RETRIEVAL: ${DVD_MAX_DRAFTS_PER_RETRIEVAL:-2}
      DVD_ADAPTIVE_CRITIC: ${DVD_ADAPTIVE_CRITIC:-true}
      DVD_CRITIC_LOW_RISK_EFFORT: ${DVD_CRITIC_LOW_RISK_EFFORT:-low}
      DVD_CRITIC_FULL_AUDIT_REASONS: ${DVD_CRITIC_FULL_AUDIT_REASONS:-absence_claim}
      DVD_PLANNER_FAST_PATH: ${DVD_PLANNER_FAST_PATH:-true}
      DVD_PLANNER_REASONING_EFFORT: ${DVD_PLANNER_REASONING_EFFORT:-low}
      DVD_PLANNER_MAX_OUTPUT_TOKENS: ${DVD_PLANNER_MAX_OUTPUT_TOKENS:-4096}
      DVD_DEFERRED_CHAT_SETUP: ${DVD_DEFERRED_CHAT_SETUP:-true}
      DVD_CRITIC_CONTEXT: ${DVD_CRITIC_CONTEXT:-auto}
      DVD_SMALL_FIRST_RETRIEVAL: ${DVD_SMALL_FIRST_RETRIEVAL:-true}
      DVD_FIRST_PASS_LIMIT: ${DVD_FIRST_PASS_LIMIT:-6}
      DVD_FIRST_PASS_MAX_HITS: ${DVD_FIRST_PASS_MAX_HITS:-8}
      DVD_PERSISTENT_MCP_SESSION: ${DVD_PERSISTENT_MCP_SESSION:-true}
      DVD_KNOWLEDGE_FALLBACK: ${DVD_KNOWLEDGE_FALLBACK:-true}
      DVD_READABLE_CITATIONS: ${DVD_READABLE_CITATIONS:-true}
      DVD_CRITIC_MAX_OUTPUT_TOKENS: ${DVD_CRITIC_MAX_OUTPUT_TOKENS:-12000}
      DVD_PARALLEL_CRITIC: ${DVD_PARALLEL_CRITIC:-true}
      DVD_CRITIC_LINES_PER_CALL: ${DVD_CRITIC_LINES_PER_CALL:-3}
      DVD_CRITIC_MAX_PARALLEL: ${DVD_CRITIC_MAX_PARALLEL:-6}
      PZZ_MCP_SERVER: ${PZZ_MCP_SERVER:-}
      PZZ_API_URL: ${PZZ_API_URL:-}
      NORM_GRAPH_MCP_SERVER: ${NORM_GRAPH_MCP_SERVER}
      URBAN_MCP_SERVER: ${URBAN_MCP_SERVER}
      LLM_BACKEND: ${LLM_BACKEND:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_THINK_MODE: ${OPENAI_THINK_MODE:-reasoning_effort}
      OPENAI_REQUEST_PRIORITY: ${OPENAI_REQUEST_PRIORITY:-}
      LLM_REQUEST_PRIORITIES: ${LLM_REQUEST_PRIORITIES:-}
      LLM_REQUEST_PRIORITY_ENABLED: ${LLM_REQUEST_PRIORITY_ENABLED:-true}
      OPENAI_THINK_EFFORT: ${OPENAI_THINK_EFFORT:-low}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      DEFAULT_LLM_MODEL_HINT: ${DEFAULT_LLM_MODEL_HINT:-gpt-oss}
      LLM_NOMINAL_TOKENS_PER_SECOND: ${LLM_NOMINAL_TOKENS_PER_SECOND:-100}
      LLM_DEADLINE_MAX_FACTOR: ${LLM_DEADLINE_MAX_FACTOR:-4}
      CHAT_STORAGE: ${CHAT_STORAGE}
      URBAN_API_URL: ${URBAN_API_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_LOG_COMMANDS: ${REDIS_LOG_COMMANDS:-true}
      SYSTEM_PASSWORD: ${SYSTEM_PASSWORD}
      # Both must be set for the UI login form (/auth/available -> enabled);
      # without them the UI falls back to the auth-helper redirect.
      AUTH_HELPER_URL: ${AUTH_HELPER_URL:-}
      AUTH_HELPER_API_KEY: ${AUTH_HELPER_API_KEY:-}
      AUTH_LOG_USERNAME: ${AUTH_LOG_USERNAME:-false}
      # External origin for generated file links (compliance report); relative if empty.
      COMPLIANCE_MAX_UPLOAD_MB: ${COMPLIANCE_MAX_UPLOAD_MB:-50}
      COMPLIANCE_MAX_ARCHIVE_MEMBERS: ${COMPLIANCE_MAX_ARCHIVE_MEMBERS:-2000}
      COMPLIANCE_MAX_UNPACKED_MB: ${COMPLIANCE_MAX_UNPACKED_MB:-200}
      COMPLIANCE_MAX_LAYERS: ${COMPLIANCE_MAX_LAYERS:-500}
      SERVICE_AUTH_SERVER_URL: ${SERVICE_AUTH_SERVER_URL:?SERVICE_AUTH_SERVER_URL is required}
      SERVICE_AUTH_REALM: ${SERVICE_AUTH_REALM:?SERVICE_AUTH_REALM is required}
      SERVICE_AUTH_CLIENT_ID: ${SERVICE_AUTH_CLIENT_ID:?SERVICE_AUTH_CLIENT_ID is required}
      SERVICE_AUTH_CLIENT_SECRET: ${SERVICE_AUTH_CLIENT_SECRET:?SERVICE_AUTH_CLIENT_SECRET is required}
      SCENARIO_DATA_LINEAR_WORKFLOW_ENABLED: ${SCENARIO_DATA_LINEAR_WORKFLOW_ENABLED:-true}
      # Optional Synapse gateway; once enabled, the URL and service account are required.
      SYNAPSE_ENABLED: ${SYNAPSE_ENABLED:-false}
      SYNAPSE_API_URL: ${SYNAPSE_API_URL:-}
      SYNAPSE_SERVICE_EMAIL: ${SYNAPSE_SERVICE_EMAIL:-}
      SYNAPSE_SERVICE_PASSWORD: ${SYNAPSE_SERVICE_PASSWORD:-}
      # Layers of user uploads; the volume keeps them across deploys (records live in Redis).
      GMART_CACHE_DIR: /var/cache/gmart
    volumes:
      - gmart_cache:/var/cache/gmart
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  context_worker:
    logging: *default-logging
    image: ${AGENTS_IMAGE}
    restart: always
    command: ["python", "-m", "src.agents.workers.context_worker"]
    environment: *agents-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No image healthcheck: --wait checks that this background worker is running.
    # Avoid disable: true, which breaks --wait on older Compose versions.

  idu_mcp:
    logging: *default-logging
    image: ${MCP_IMAGE}
    container_name: ${MCP_CONTAINER_NAME}
    restart: always
    ports:
      - "8000:8000"
    environment:
      URBAN_API_URL: ${URBAN_API_URL}
      SERVICE_AUTH_SERVER_URL: ${SERVICE_AUTH_SERVER_URL:?SERVICE_AUTH_SERVER_URL is required}
      SERVICE_AUTH_REALM: ${SERVICE_AUTH_REALM:?SERVICE_AUTH_REALM is required}
      SERVICE_AUTH_CLIENT_ID: ${SERVICE_AUTH_CLIENT_ID:?SERVICE_AUTH_CLIENT_ID is required}
      SERVICE_AUTH_CLIENT_SECRET: ${SERVICE_AUTH_CLIENT_SECRET:?SERVICE_AUTH_CLIENT_SECRET is required}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gmart_cache:

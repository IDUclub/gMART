services:
  idu_agents:
    image: ${AGENTS_IMAGE}
    container_name: ${AGENTS_CONTAINER_NAME}
    restart: always
    ports:
      - "80:80"
    environment: &agents-environment
      OLLAMA_API_URL: ${OLLAMA_API_URL}
      IDU_MCP_SERVER: ${IDU_MCP_SERVER}
      OBJECTS_EFFECTS_MCP_SERVER: ${OBJECTS_EFFECTS_MCP_SERVER}
      DVD_MCP_SERVER: ${DVD_MCP_SERVER}
      DVD_API_URL: ${DVD_API_URL:-}
      DVD_CONTEXT_WINDOW_TOKENS: ${DVD_CONTEXT_WINDOW_TOKENS:-32000}
      DVD_CONTEXT_CONCURRENCY: ${DVD_CONTEXT_CONCURRENCY:-4}
      DVD_RETRIEVAL_MAX_PAGES: ${DVD_RETRIEVAL_MAX_PAGES:-100}
      DVD_ANSWER_TEMPERATURE: ${DVD_ANSWER_TEMPERATURE:-0.2}
      DVD_CRITIC_REASONING_EFFORT: ${DVD_CRITIC_REASONING_EFFORT:-medium}
      DVD_MAX_DRAFTS_PER_RETRIEVAL: ${DVD_MAX_DRAFTS_PER_RETRIEVAL:-2}
      PZZ_MCP_SERVER: ${PZZ_MCP_SERVER:-}
      PZZ_API_URL: ${PZZ_API_URL:-}
      NORM_GRAPH_MCP_SERVER: ${NORM_GRAPH_MCP_SERVER}
      URBAN_MCP_SERVER: ${URBAN_MCP_SERVER}
      LLM_BACKEND: ${LLM_BACKEND:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_THINK_MODE: ${OPENAI_THINK_MODE:-reasoning_effort}
      OPENAI_THINK_EFFORT: ${OPENAI_THINK_EFFORT:-low}
      CHAT_STORAGE: ${CHAT_STORAGE}
      URBAN_API_URL: ${URBAN_API_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_LOG_COMMANDS: ${REDIS_LOG_COMMANDS:-true}
      SYSTEM_PASSWORD: ${SYSTEM_PASSWORD}
      # Both must be set for the UI login form (/auth/available -> enabled);
      # without them the UI falls back to the auth-helper redirect.
      AUTH_HELPER_URL: ${AUTH_HELPER_URL:-}
      AUTH_HELPER_API_KEY: ${AUTH_HELPER_API_KEY:-}
      AUTH_LOG_USERNAME: ${AUTH_LOG_USERNAME:-false}
      # External origin for generated file links (compliance report); relative if empty.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SERVICE_AUTH_SERVER_URL: ${SERVICE_AUTH_SERVER_URL:?SERVICE_AUTH_SERVER_URL is required}
      SERVICE_AUTH_REALM: ${SERVICE_AUTH_REALM:?SERVICE_AUTH_REALM is required}
      SERVICE_AUTH_CLIENT_ID: ${SERVICE_AUTH_CLIENT_ID:?SERVICE_AUTH_CLIENT_ID is required}
      SERVICE_AUTH_CLIENT_SECRET: ${SERVICE_AUTH_CLIENT_SECRET:?SERVICE_AUTH_CLIENT_SECRET is required}
      SCENARIO_DATA_LINEAR_WORKFLOW_ENABLED: ${SCENARIO_DATA_LINEAR_WORKFLOW_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  context_worker:
    image: ${AGENTS_IMAGE}
    restart: always
    command: ["python", "-m", "src.agents.workers.context_worker"]
    environment: *agents-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No image healthcheck: --wait checks that this background worker is running.
    # Avoid disable: true, which breaks --wait on older Compose versions.

  idu_mcp:
    image: ${MCP_IMAGE}
    container_name: ${MCP_CONTAINER_NAME}
    restart: always
    ports:
      - "8000:8000"
    environment:
      URBAN_API_URL: ${URBAN_API_URL}
      SERVICE_AUTH_SERVER_URL: ${SERVICE_AUTH_SERVER_URL:?SERVICE_AUTH_SERVER_URL is required}
      SERVICE_AUTH_REALM: ${SERVICE_AUTH_REALM:?SERVICE_AUTH_REALM is required}
      SERVICE_AUTH_CLIENT_ID: ${SERVICE_AUTH_CLIENT_ID:?SERVICE_AUTH_CLIENT_ID is required}
      SERVICE_AUTH_CLIENT_SECRET: ${SERVICE_AUTH_CLIENT_SECRET:?SERVICE_AUTH_CLIENT_SECRET is required}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

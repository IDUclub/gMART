# Режим и параметры расчёта обеспеченности (ProvisionPlanBuilder).
stage: provision.plan
defaults:
  services_catalog: ["Школа", "Детский сад", "Поликлиника", "Аптека", "Спортивный зал"]

cases:
  - id: current_provision_single
    tags: [smoke]
    input: {user_query: "Какая обеспеченность школами?"}
    expect:
      - {path: mode, eq: provision}
      - {path: final.service_name, eq: "Школа"}

  - id: effects_single_service_declension
    input: {user_query: "Как проект повлияет на обеспеченность детскими садами?"}
    expect:
      - {path: mode, eq: effects}
      - {path: final.service_name, eq: "Детский сад"}

  - id: ambiguous_single_service_defaults_to_effects
    input: {user_query: "Расскажи про обеспеченность поликлиниками в проекте"}
    expect:
      - {path: mode, eq: effects}
      - {path: final.service_name, eq: "Поликлиника"}

  - id: summary_all_services
    tags: [smoke]
    input: {user_query: "Дай сводку по обеспеченности сервисами"}
    expect:
      - {path: mode, eq: summary}
      - {path: service_names, len: 0}

  - id: summary_worst_services
    input: {user_query: "Какими сервисами территория обеспечена хуже всего?"}
    expect:
      - {path: mode, eq: summary}

  - id: effects_summary_all
    input: {user_query: "Сравни обеспеченность по всем сервисам до и после реализации проекта"}
    expect:
      - {path: mode, eq: effects_summary}
      - {path: service_names, len: 0}

  - id: effects_without_service_is_summary
    input: {user_query: "Как проект повлияет на обеспеченность?"}
    expect:
      - {path: final.mode, eq: effects_summary}

  - id: list_services
    input: {user_query: "Какие сервисы есть в проекте?"}
    expect:
      - {path: mode, eq: list_services}

  - id: summary_subset_with_layers
    input: {user_query: "Сводка по школам и аптекам, слои аптек покажи на карте"}
    expect:
      - {path: mode, eq: summary}
      - {path: final.service_names, set_eq: ["Школа", "Аптека"]}
      - {path: final.layer_service_names, eq: ["Аптека"]}

  - id: unknown_service_needs_clarification
    tags: [clarification]
    input: {user_query: "Какая обеспеченность бассейнами?"}
    expect:
      - {path: mode, eq: needs_clarification}
      - {path: final.mode, eq: needs_clarification}

  - id: target_population_explicit
    input: {user_query: "Рассчитай эффекты по школам для населения 45 000 человек"}
    expect:
      - {path: mode, eq: effects}
      - {path: final.service_name, eq: "Школа"}
      - {path: target_population, eq: 45000}

  - id: project_word_is_not_a_service
    input: {user_query: "Какая обеспеченность аптеками в проекте и сценарии?"}
    expect:
      - {path: final.service_name, eq: "Аптека"}
      - {path: target_population, "null": true}

  - id: followup_population_from_history
    tags: [history]
    input:
      history:
        - {role: user, content: "Какая обеспеченность школами?"}
        - {role: assistant, content: "Обеспеченность школами — 78%."}
      user_query: "Пересчитай с населением 30000"
    expect:
      - {path: mode, eq: provision}
      - {path: final.service_name, eq: "Школа"}
      - {path: target_population, eq: 30000}

  - id: followup_latest_population_wins
    tags: [history]
    input:
      history:
        - {role: user, content: "Как проект повлияет на обеспеченность детскими садами при 20000 жителей?"}
        - {role: assistant, content: "При 20000 жителей дефицит детских садов — 120 мест."}
      user_query: "Нет, возьми 25000"
    expect:
      - {path: mode, eq: effects}
      - {path: final.service_name, eq: "Детский сад"}
      - {path: target_population, eq: 25000}

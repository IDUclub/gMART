# План построения буферов и ограничений (RestrictionPlanBuilder).
# Верх — первый план модели; final — канонизированный план после repair-проходов (тоже модель).
stage: restriction.plan
defaults:
  scenario_id: 1001
  services_catalog: ["Школа", "Детский сад", "Поликлиника", "Больница"]
  physical_objects_catalog: ["Жилой дом", "Река", "Озеро", "Ручей", "Лес", "Автомобильная дорога", "Промышленный объект"]

cases:
  - id: buffers_only_around_schools
    tags: [smoke]
    input: {user_query: "Построй буфер 100 м вокруг школ"}
    expect:
      - {path: final.mode, eq: buffers_only}
      - {path: "final.source_entities[*].name", eq: ["Школа"]}
      - {path: "final.buffer_rules[*].buffer_size", eq: [100]}
      - {path: final.target_entities, len: 0}

  - id: targets_near_forest
    tags: [smoke]
    input: {user_query: "Какие жилые дома ближе 50 м к лесу?"}
    expect:
      - {path: final.mode, eq: restrictions}
      - {path: "final.source_entities[*].name", eq: ["Лес"]}
      - {path: "final.target_entities[*].name", eq: ["Жилой дом"]}
      - {path: "final.buffer_rules[*].buffer_size", eq: [50]}

  - id: generic_category_expanded
    input: {user_query: "Построй буферы 20 метров от водных объектов"}
    expect:
      - {path: final.mode, eq: buffers_only}
      - {path: "final.source_entities[*].name", set_eq: ["Река", "Озеро", "Ручей"]}
      - {path: "final.buffer_rules[*].buffer_size", set_eq: [20]}

  - id: missing_radius_needs_clarification
    tags: [clarification]
    input: {user_query: "Построй буфер вокруг больниц"}
    expect:
      - {path: final.mode, eq: needs_clarification}
      - {path: final.clarification_question, "null": false}

  - id: several_targets_services
    input: {user_query: "Какие школы и детские сады попадают в 300-метровую зону от промышленных объектов?"}
    expect:
      - {path: final.mode, eq: restrictions}
      - {path: "final.source_entities[*].name", eq: ["Промышленный объект"]}
      - {path: "final.target_entities[*].name", set_eq: ["Школа", "Детский сад"]}
      - {path: "final.target_entities[*].entity_type", set_eq: [service]}
      - {path: "final.buffer_rules[*].buffer_size", eq: [300]}

  - id: source_is_distance_origin_not_grammar
    input: {user_query: "Найди поликлиники, расположенные в пределах 200 м от автомобильных дорог"}
    expect:
      - {path: final.mode, eq: restrictions}
      - {path: "final.source_entities[*].name", eq: ["Автомобильная дорога"]}
      - {path: "final.target_entities[*].name", eq: ["Поликлиника"]}

  - id: unknown_entity_not_invented
    tags: [clarification]
    input: {user_query: "Построй буфер 500 м вокруг аэропортов"}
    expect:
      - {path: final.mode, eq: needs_clarification}
      - {path: "final.source_entities[*].name", not_contains: ["Аэропорт"]}

  - id: normgraph_rule_grounded
    tags: [normgraph]
    input:
      user_query: "Проверь жилые дома по отступу от автомобильных дорог по СП 42.13330"
      normgraph_restrictions:
        - id: "ng-road-housing-25"
          subject: "Автомобильная дорога"
          object: "Жилой дом"
          kind: "минимальное расстояние"
          value: {operator: ">=", number: 25, unit: "м"}
          extraction_text: "Расстояние от края проезжей части автомобильных дорог до жилых домов следует принимать не менее 25 м."
          provenance: {doc_id: "sp42", name: "СП 42.13330.2016", version: "2016", numbering: "8.21"}
    expect:
      - {path: final.mode, eq: restrictions}
      - {path: "final.buffer_rules[*].restriction_id", eq: ["ng-road-housing-25"]}
      - {path: "final.buffer_rules[*].buffer_size", eq: [25]}
      - {path: "final.restriction_rules[*].origin", set_eq: [normgraph]}
      - {path: "final.target_entities[*].name", eq: ["Жилой дом"]}

  - id: user_distance_overrides_without_normgraph
    tags: [normgraph]
    input:
      user_query: "Какие жилые дома ближе 40 м к реке? Используй своё расстояние 40 м"
      normgraph_restrictions:
        - id: "ng-river-housing-50"
          subject: "Река"
          object: "Жилой дом"
          kind: "водоохранная зона"
          value: {operator: ">=", number: 50, unit: "м"}
          extraction_text: "Ширина прибрежной защитной полосы составляет 50 м."
          provenance: {doc_id: "vk", name: "Водный кодекс РФ", numbering: "65"}
    expect:
      - {path: final.mode, eq: restrictions}
      - {path: "final.buffer_rules[*].buffer_size", eq: [40]}
      - {path: "final.buffer_rules[*].origin", eq: [user]}
